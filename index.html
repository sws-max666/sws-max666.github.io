<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的主页</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #333333;
            color: #333;
            text-align: center;
            padding-top: 100px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; font-size: 18px; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover { background-color: #2c974b; }
    </style>
</head>
<body>
    <div class="card">
        <img src="photo.png" alt="我的头像" style="width: 150px; border-radius: 50%;">
        <h1>👋 你好，我是 sws-max666</h1>
        <p>欢迎来到我的第一个 GitHub Pages 个人主页！</p>
        <p>我正在学习如何搭建网站，这里以后会放上更多有趣的内容。</p>
        <a href="https://github.com/sws-max666">访问我的 GitHub</a>
    </div>
</body>
</html>
