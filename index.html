<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sws-max666 的个人主页</title>
    <style>
        /* 引入更高级的字体，如果没有加载出来会用默认字体 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #333333 100%); /* 渐变深色背景 */
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 卡片入场动画 */
        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.95); /* 微微透明白底 */
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: floatIn 0.8s ease-out forwards; /* 触发动画 */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* 鼠标悬停过渡效果 */
        }

        /* 鼠标放在卡片上，卡片会飘起来 */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover; /* 保证图片不变形 */
            border: 4px solid #2ea44f;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg); /* 鼠标放上去变大并倾斜 */
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* 技能标签栏 */
        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .skill-tag {
            background: #eef2f5;
            color: #555;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .skill-tag:hover {
            background: #2ea44f;
            color: white;
        }

        /* 按钮组 */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #2ea44f;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2c974b;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(46, 164, 79, 0.4);
        }

        .btn-outline {
            border: 2px solid #2ea44f;
            color: #2ea44f;
            background: transparent;
        }

        .btn-outline:hover {
            background: #2ea44f;
            color: white;
            transform: translateY(-3px);
        }

        /* 手机端适配（屏幕宽度小于 600px 时生效） */
        @media (max-width: 600px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 24px; }
            .buttons { flex-direction: column; }
            .btn { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="photo.png" alt="我的头像" class="avatar">
        
        <h1>👋 你好，我是 sws-max666</h1>
        <p class="subtitle">欢迎来到我的个人主页！<br>我是一名正在探索代码世界的初学者。</p>

        <!-- 技能标签 -->
        <div class="skills">
            <span class="skill-tag">HTML</span>
            <span class="skill-tag">CSS</span>
            <span class="skill-tag">GitHub Pages</span>
            <span class="skill-tag">持续学习中...</span>
        </div>

        <!-- 按钮组 -->
        <div class="buttons">
            <a href="https://github.com/sws-max666" target="_blank" class="btn btn-primary">访问我的 GitHub</a>
            <a href="mailto:2220345267@qq.com" class="btn btn-outline">联系我</a>
        </div>
    </div>

</body>
</html>
