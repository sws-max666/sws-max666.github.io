<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sws-max666 的个人主页</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        /* 1. 动态呼吸背景 */
        body {
            font-family: 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a1a1a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden; /* 防止背景光晕导致滚动条 */
            position: relative;
        }

        /* 背景渐变动画 */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 背景漂浮的光晕 */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
        .glow-1 {
            width: 300px;
            height: 300px;
            background: rgba(46, 164, 79, 0.4);
            top: 10%;
            left: 20%;
            animation: floatGlow 8s infinite alternate;
        }
        .glow-2 {
            width: 250px;
            height: 250px;
            background: rgba(59, 130, 246, 0.4);
            bottom: 10%;
            right: 20%;
            animation: floatGlow 10s infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        /* 2. 毛玻璃卡片 */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.08); /* 极低透明度的白色 */
            backdrop-filter: blur(16px); /* 核心：毛玻璃模糊效果 */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15); /* 淡淡的边框 */
            max-width: 500px;
            width: 90%;
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            text-align: center;
            animation: floatIn 0.8s ease-out forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 60px rgba(0,0,0,0.6);
            background: rgba(255, 255, 255, 0.12);
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 3. 旋转头像光环 */
        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
        }

        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, #2ea44f 50%, transparent 100%);
            animation: spin 4s linear infinite;
            z-index: -1;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1a1a1a; /* 遮住内部的黑色底 */
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .subtitle {
            color: #b0c4de;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* 技能标签 */
        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .skill-tag:hover {
            background: #2ea44f;
            color: white;
            border-color: #2ea44f;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(46, 164, 79, 0.3);
        }

        /* 按钮组 */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2ea44f, #27ae60);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(46, 164, 79, 0.6);
        }

        .btn-outline {
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-outline:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px) scale(1.02);
        }

        /* 手机端适配 */
        @media (max-width: 600px) {
            .card { padding: 40px 20px; }
            h1 { font-size: 24px; }
            .buttons { flex-direction: column; }
            .btn { width: 100%; box-sizing: border-box; }
        }
                /* 故障风特效 */
        .glitch {
            position: relative;
            color: white;
            animation: glitch-skew 4s infinite linear alternate-reverse;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 red;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 blue;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 83px, 0); }
            20% { clip: rect(62px, 9999px, 14px, 0); }
            40% { clip: rect(33px, 9999px, 91px, 0); }
            60% { clip: rect(89px, 9999px, 22px, 0); }
            80% { clip: rect(5px, 9999px, 67px, 0); }
            100% { clip: rect(77px, 9999px, 35px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(12px, 9999px, 59px, 0); }
            40% { clip: rect(85px, 9999px, 33px, 0); }
            60% { clip: rect(22px, 9999px, 75px, 0); }
            80% { clip: rect(99px, 9999px, 5px, 0); }
            100% { clip: rect(40px, 9999px, 88px, 0); }
        }
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(1deg); }
            60% { transform: skew(-1deg); }
            80% { transform: skew(2deg); }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
<body>

    <!-- 背景光晕 -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="card">
        <!-- 带有旋转光环的头像区域 -->
        <div class="avatar-wrapper">
            <img src="photo.png" alt="我的头像" class="avatar">
        </div>
        
        <h1><span class="glitch" data-text="你好，我是 sws-max666">👋 你好，我是 sws-max666</span></h1>
        <p class="subtitle" id="typewriter"></p>

        <div class="skills">
            <span class="skill-tag">HTML</span>
            <span class="skill-tag">CSS</span>
            <span class="skill-tag">GitHub Pages</span>
            <span class="skill-tag">UI 设计中...</span>
        </div>

        <div class="buttons">
            <a href="https://github.com/sws-max666" target="_blank" class="btn btn-primary">访问我的 GitHub</a>
            <a href="mailto:2220345267@qq.com" class="btn btn-outline">联系我</a>
        </div>
    </div>

<script>
        // 魔法1：打字机效果
        const text = "欢迎来到我的个人主页！\n我是一名正在探索代码世界的初学者。";
        let i = 0;
        function type() {
            if (i < text.length) {
                // 将换行符替换成 <br> 标签，保持文字换行
                document.getElementById("typewriter").innerHTML = text.substring(0, i+1).replace(/\n/g, '<br>');
                i++;
                setTimeout(type, 80); // 80毫秒打一个字
            }
        }
        type();


        // 魔法3：点击粒子爆炸特效
        document.addEventListener('click', function(e) {
            let colors = ['#2ea44f', '#3b82f6', '#ffffff']; // 绿、蓝、白
            for (let i = 0; i < 15; i++) {
                let particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.borderRadius = '50%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = e.pageX + 'px';
                particle.style.top = e.pageY + 'px';
                particle.style.pointerEvents = 'none';
                particle.style.transition = 'all 0.8s ease-out';
                document.body.appendChild(particle);
                
                let x = (Math.random() - 0.5) * 200;
                let y = (Math.random() - 0.5) * 200;
                setTimeout(() => {
                    particle.style.transform = `translate(${x}px, ${y}px) scale(0)`;
                    particle.style.opacity = '0';
                }, 10);
                
                setTimeout(() => { particle.remove(); }, 800);
            }
        });
    </script>  
        <script>
        // 鼠标星光拖尾特效
        document.addEventListener('mousemove', function(e) {
            // 控制生成星星的频率
            if (Math.random() > 0.3) return; 

            let sparkle = document.createElement('div');
            sparkle.style.position = 'fixed';
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            sparkle.style.width = '6px';
            sparkle.style.height = '6px';
            sparkle.style.borderRadius = '50%';
            // 随机颜色（蓝、绿、白、微黄）
            let colors = ['#3b82f6', '#2ea44f', '#ffffff', '#fef08a'];
            sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            sparkle.style.boxShadow = `0 0 10px ${sparkle.style.backgroundColor}`;
            sparkle.style.pointerEvents = 'none'; // 防止挡住鼠标点击
            sparkle.style.zIndex = '9999';
            sparkle.style.transition = 'all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            
            document.body.appendChild(sparkle);

            // 让星星随机往四周飘落，然后消失
            setTimeout(() => {
                let x = (Math.random() - 0.5) * 100;
                let y = (Math.random() - 0.5) * 100 + 50; // 重力向下
                sparkle.style.transform = `translate(${x}px, ${y}px) scale(0)`;
                sparkle.style.opacity = '0';
            }, 10);

            // 动画结束移除元素
            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        });
    </script>
</body>
</html>
